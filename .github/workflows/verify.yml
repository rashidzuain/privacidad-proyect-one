name: Verificar flujos

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Regenerar y comprobar
        run: npm run verify
      - name: Comprobar que las exportaciones están actualizadas
        run: git diff --exit-code -- workflows/
